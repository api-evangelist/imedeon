name: iMedeon
description: 'iMedeon, Inc. was a mobile workforce management software company based in Atlanta, Georgia,
  providing wireless web applications to optimize scheduling, routing, and the dispatch and management of
  mobile field workforces (the iM:Work suite). It was acquired by ViryaNet Ltd. in February 2002 (later
  rolled into Verisae) and no longer operates independently. The domain imedeon.com does not resolve and
  there is no live website, developer portal, or API surface. Retained in the API Evangelist network as a
  defunct/legacy company profile; there is nothing to enrich.'
